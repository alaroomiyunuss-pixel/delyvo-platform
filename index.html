<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <script src="shared/lang.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F7F5">
  <title>Delyvo · المنصة التجريبية</title>
  <meta name="description" content="نموذج تفاعلي لمنصة Delyvo لاشتراكات الوجبات: تطبيق العميل، تطبيق السائق، لوحة المطعم، ولوحة الأدمن.">
  <link rel="icon" href="assets/img/icon-192.png">
  <link rel="stylesheet" href="shared/base.css">
  <style>
    body { background: radial-gradient(1100px 520px at 85% -8%, #DDF2E7 0%, transparent 60%), var(--bg); min-height: 100vh; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
    header.top { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
    header.top img { height: 30px; }
    .hero { padding: 28px 0 34px; display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; }
    .hero h1 { font-size: clamp(30px, 4.4vw, 48px); letter-spacing: -.025em; line-height: 1.15; }
    .hero h1 span { color: var(--brand); }
    .hero p { color: var(--mute); font-size: 17px; margin-top: 14px; max-width: 560px; }
    .hero .cta { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .qr-card { background: #fff; border-radius: 24px; padding: 22px; box-shadow: var(--sh-2); display: flex; gap: 18px; align-items: center; border: 1px solid var(--line-2); }
    .qr-card #qr { width: 132px; height: 132px; flex: none; display: grid; place-items: center; background: var(--brand-ll); border-radius: 14px; }
    .qr-card #qr img, .qr-card #qr svg { width: 120px; height: 120px; }
    .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .app { background: #fff; border-radius: 24px; border: 1px solid var(--line-2); box-shadow: var(--sh-1); overflow: hidden; display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s; }
    .app:hover { transform: translateY(-4px); box-shadow: var(--sh-3); }
    .app .shot { height: 150px; position: relative; display: grid; place-items: center; font-size: 54px; background: linear-gradient(135deg, var(--c1), var(--c2)); }
    .app .shot small { position: absolute; top: 12px; inset-inline-start: 12px; background: rgba(255,255,255,.9); border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700; color: var(--ink); }
    .app .body { padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .app h3 { font-size: 18px; }
    .app ul { margin: 4px 0 8px; padding-inline-start: 18px; color: var(--mute); font-size: 13.5px; }
    .app ul li { margin: 3px 0; }
    .app .cred { font-size: 12.5px; background: var(--line-2); border-radius: 10px; padding: 6px 10px; }
    .app .btn { margin-top: auto; }
    h2.sec { font-size: 24px; margin: 44px 0 16px; }
    .flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .flow .st { background: #fff; border-radius: 18px; padding: 16px; border: 1px solid var(--line-2); position: relative; }
    .flow .st b { display: block; margin: 6px 0 4px; }
    .flow .st p { font-size: 13px; color: var(--mute); }
    .flow .st .n { position: absolute; top: 12px; inset-inline-end: 14px; font-family: var(--font-lat); font-weight: 800; color: #D5E3DB; font-size: 26px; }
    .flow .st .ic { font-size: 26px; }
    .live { display: none; margin-top: 18px; }
    .live.on { display: block; }
    .live-grid { display: grid; grid-template-columns: auto auto 1fr; gap: 18px; align-items: start; }
    .mini-phone { width: 300px; height: 650px; border-radius: 44px; background: #0E1512; padding: 9px; box-shadow: 0 0 0 2px #2A332F, 0 30px 60px -20px rgba(10,40,25,.4); }
    .mini-phone iframe { width: 100%; height: 100%; border: 0; border-radius: 36px; background: var(--bg); }
    .panel-frame { height: 650px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--sh-2); background: #fff; display: flex; flex-direction: column; }
    .panel-frame .bar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line-2); background: var(--bg); }
    .panel-frame .bar i { width: 10px; height: 10px; border-radius: 50%; background: #E2E8E4; }
    .panel-frame .bar select { margin-inline-start: auto; height: 30px; border-radius: 8px; border: 1px solid var(--line); padding: 0 8px; }
    .panel-frame iframe { flex: 1; border: 0; width: 100%; }
    .cap { text-align: center; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--ink-2); }
    .lang-sw { display: flex; background: var(--line-2); border-radius: 999px; padding: 3px; margin-inline-end: 8px; }
    .lang-sw button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--mute); }
    .lang-sw button.on { background: #fff; color: var(--ink); box-shadow: var(--sh-1); }
    footer { padding: 40px 0; color: var(--mute); font-size: 13px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    @media (max-width: 1100px) { .apps { grid-template-columns: repeat(2, 1fr); } .flow { grid-template-columns: repeat(2, 1fr); } .live-grid { grid-template-columns: 1fr 1fr; } .panel-frame { grid-column: 1 / -1; } }
    @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .apps { grid-template-columns: 1fr; } .flow { grid-template-columns: 1fr; } .live-grid { grid-template-columns: 1fr; justify-items: center; } .qr-card { display: none; } .panel-frame { width: 100%; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top"><img src="assets/img/logo.png" alt="Delyvo"><div class="row"><div class="lang-sw"><button data-lang="ar">عربي</button><button data-lang="en">EN</button></div><button class="btn btn-sm btn-ghost" id="reset" data-t="reset"></button></div></header>
    <section class="hero">
      <div>
        <span class="chip chip-brand" data-t="badge"></span>
        <h1 style="margin-top:14px" data-t="h1"></h1>
        <p data-t="lead"></p>
        <div class="cta"><a class="btn btn-primary" href="customer/" data-t="openCustomer"></a><button class="btn btn-outline" id="liveBtn" data-t="live"></button></div>
      </div>
      <div class="qr-card"><div id="qr">📱</div><div><b data-t="qrT"></b><p class="muted small" style="margin-top:6px" data-t="qrS"></p></div></div>
    </section>
    <section class="live" id="live">
      <div class="live-grid">
        <div><div class="cap" data-t="capC"></div><div class="mini-phone"><iframe src="customer/" title="Customer"></iframe></div></div>
        <div><div class="cap" data-t="capD"></div><div class="mini-phone"><iframe src="driver/" title="Driver"></iframe></div></div>
        <div><div class="cap" data-t="capP"></div><div class="panel-frame"><div class="bar"><i></i><i></i><i></i><select id="panelSel"><option value="restaurant/" data-t="restaurant"></option><option value="admin/" data-t="admin"></option></select></div><iframe id="panel" src="restaurant/" title="Panel"></iframe></div></div>
      </div>
      <p class="muted small" style="margin-top:12px;text-align:center" data-t="liveNote"></p>
    </section>
    <h2 class="sec" data-t="apps"></h2>
    <section class="apps">
      <article class="app" style="--c1:#E8F6EF;--c2:#C9EEDB"><div class="shot">📱<small>iOS / Android · PWA</small></div><div class="body"><h3 data-t="customer"></h3><ul data-t="custList"></ul>
        <span class="cred" data-t="custCred"></span><a class="btn btn-primary" href="customer/" data-t="openApp"></a></div></article>
      <article class="app" style="--c1:#E0F2FE;--c2:#BAE0FB"><div class="shot">🛵<small data-t="light"></small></div><div class="body"><h3 data-t="driver"></h3><ul data-t="drvList"></ul>
        <span class="cred">PIN: <b class="num">1111</b> / <b class="num">2222</b> / <b class="num">3333</b></span><a class="btn btn-dark" href="driver/" data-t="openApp"></a></div></article>
      <article class="app" style="--c1:#FEF3C7;--c2:#FDE2A4"><div class="shot">🍳<small data-t="tablet"></small></div><div class="body"><h3 data-t="restaurant"></h3><ul data-t="resList"></ul>
        <span class="cred">PIN: <b class="num">1234</b></span><a class="btn btn-dark" href="restaurant/" data-t="openPanel"></a></div></article>
      <article class="app" style="--c1:#EDE9FE;--c2:#D9D0FB"><div class="shot">📊<small data-t="hq"></small></div><div class="body"><h3 data-t="admin"></h3><ul data-t="admList"></ul>
        <span class="cred" data-t="admCred"></span><a class="btn btn-dark" href="admin/" data-t="openPanel"></a></div></article>
    </section>
    <h2 class="sec" data-t="cycle"></h2>
    <section class="flow" data-t="flow"></section>
    <footer><span data-t="foot"></span><span class="num">v1.1</span></footer>
  </div>
  <script src="shared/data.js"></script>
  <script src="shared/store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script>
    const li = (a) => a.map((x) => `<li>${x}</li>`).join('');
    const flow = (a) => a.map(([ic, t, d], i) => `<div class="st"><span class="n">${i + 1}</span><span class="ic">${ic}</span><b>${t}</b><p>${d}</p></div>`).join('');
    const TX = {
      ar: {
        reset: '♻️ إعادة ضبط البيانات', badge: 'نموذج تفاعلي كامل · بدون باك إند',
        h1: 'منصة <span>Delyvo</span> لاشتراكات الوجبات — أربعة تطبيقات مترابطة',
        lead: 'العميل يشترك ويختار وجباته، الطلبات تتوزع تلقائياً على المطاعم الشريكة (بدون ما يشوف العميل أسماءها)، المطعم يحضّر ويطبع الاستكرات، السائق يستلم ويوصل، والأدمن يدير كل شي. كل التطبيقات متزامنة لحظياً داخل المتصفح.',
        openCustomer: '📱 افتح تطبيق العميل', live: '⚡ العرض المباشر المتزامن', qrT: 'جرّبه على جوالك', qrS: 'امسح الرمز، ثم «أضف إلى الشاشة الرئيسية» ليشتغل كتطبيق حقيقي بكامل الشاشة.',
        capC: '📱 تطبيق العميل', capD: '🛵 تطبيق السائق', capP: '🖥️ اللوحات', liveNote: 'اشترك من تطبيق العميل ← تنزل الطلبات فوراً في لوحة المطعم ← جهّزها ← السائق يستلم ← العميل يوصله إشعار. كله في نفس الشاشة.',
        apps: 'التطبيقات', customer: 'تطبيق العميل', driver: 'تطبيق السائق', restaurant: 'لوحة المطعم', admin: 'لوحة الأدمن',
        custList: li(['بنرات، اختيار الخطة والمدة والوجبات', 'تقويم البداية وأيام التوصيل', 'اختيار وجبة لكل يوم أو التخطّي', 'دفع iDEAL / Apple Pay / بطاقة / Klarna', 'تأجيل، تغيير وجبة، تتبع، تقييم، حساسية', 'عربي · Nederlands · English']),
        custCred: 'رمز التحقق: <b class="num">1234</b> · أو دخول «سارة» التجريبي', openApp: 'فتح التطبيق', openPanel: 'فتح اللوحة',
        light: 'تطبيق خفيف', drvList: li(['متصل / غير متصل', 'الاستلام من كل مطعم', 'محطات التوصيل مرتبة حسب الوقت', 'ملاحة Google Maps، صورة إثبات', 'تعذّر التسليم مع السبب', 'عربي · Nederlands · English']),
        tablet: 'للتابلت واللابتوب', resList: li(['استقبال الطلبات لحظياً مع صوت', 'لوحة كانبان: قبول ← تحضير ← جاهز', 'قائمة التحضير المجمّعة', 'طباعة استكرات بـ QR + تحذير حساسية', 'إدارة المنيو والأداء والمستحقات', 'عربي · Nederlands · English']),
        hq: 'الإدارة الرئيسية', admList: li(['مؤشرات وإيرادات ورسوم بيانية', 'العمليات اليومية وتوزيع السائقين', 'الاشتراكات والعملاء والتقييمات', 'المطاعم الشريكة والوجبات والأسعار', 'البنرات، الأكواد، الإشعارات، الإعدادات', 'عربي · English']),
        admCred: 'دخول مباشر بدون كلمة مرور', cycle: 'دورة الطلب',
        flow: flow([['🧑‍💻', 'العميل يشترك', 'يختار الخطة والأيام ووجباته ويدفع.'], ['🧭', 'توزيع على المطاعم', 'كل وجبة تروح لمطبخها الشريك تلقائياً، والعميل ما يشوف اسم المطعم.'], ['🍳', 'المطعم يحضّر', 'يقبل ويحضّر ويطبع الاستكرات قبل الموعد.'], ['🛵', 'السائق يوصّل', 'يستلم من المطاعم ويوصل للعميل ضمن وقت التوصيل.'], ['⭐', 'إشعار وتقييم', 'العميل يتابع لحظياً ويقيّم، والتقييم يوصل للمطعم والأدمن.']]),
        foot: 'Delyvo · نموذج تفاعلي. كل البيانات تجريبية ومحفوظة في متصفحك فقط.', confirm: 'إعادة كل البيانات التجريبية للوضع الأصلي؟', title: 'Delyvo · المنصة التجريبية'
      },
      en: {
        reset: '♻️ Reset demo data', badge: 'Fully interactive prototype · no backend',
        h1: 'The <span>Delyvo</span> meal-subscription platform — four connected apps',
        lead: 'Customers subscribe and pick their meals, orders are routed automatically to partner restaurants (customers never see their names), restaurants prepare and print labels, drivers pick up and deliver, and admins run everything. All apps sync live in the browser.',
        openCustomer: '📱 Open the customer app', live: '⚡ Live synced view', qrT: 'Try it on your phone', qrS: 'Scan the code, then "Add to Home Screen" to run it full-screen like a real app.',
        capC: '📱 Customer app', capD: '🛵 Driver app', capP: '🖥️ Dashboards', liveNote: 'Subscribe in the customer app → orders land instantly in the restaurant panel → mark them ready → the driver picks up → the customer gets notified. All on one screen.',
        apps: 'The apps', customer: 'Customer app', driver: 'Driver app', restaurant: 'Restaurant panel', admin: 'Admin panel',
        custList: li(['Banners, choose plan, duration and meals', 'Start-date calendar and delivery days', 'Pick a meal per day, or skip and choose later', 'Pay with iDEAL / Apple Pay / card / Klarna', 'Postpone, swap meals, track, rate, allergies', 'Arabic · Nederlands · English']),
        custCred: 'Verification code: <b class="num">1234</b> · or the "Sara" demo login', openApp: 'Open app', openPanel: 'Open panel',
        light: 'Lightweight', drvList: li(['Online / offline', 'Pickups per restaurant', 'Delivery stops sorted by time window', 'Google Maps navigation, photo proof', 'Failed delivery with reason', 'Arabic · Nederlands · English']),
        tablet: 'Tablet & laptop', resList: li(['Live incoming orders with sound', 'Kanban: accept → prepare → ready', 'Aggregated prep list', 'Label printing with QR + allergy warning', 'Menu, performance and payouts', 'Arabic · Nederlands · English']),
        hq: 'Headquarters', admList: li(['KPIs, revenue and charts', 'Daily operations and driver dispatch', 'Subscriptions, customers and reviews', 'Partner restaurants, meals and pricing', 'Banners, promo codes, notifications, settings', 'Arabic · English']),
        admCred: 'Opens directly — no password', cycle: 'Order lifecycle',
        flow: flow([['🧑‍💻', 'Customer subscribes', 'Chooses plan, days and meals, then pays.'], ['🧭', 'Routed to restaurants', 'Each meal goes to its partner kitchen automatically — the customer never sees the restaurant.'], ['🍳', 'Restaurant prepares', 'Accepts, cooks and prints labels before the slot.'], ['🛵', 'Driver delivers', 'Picks up from restaurants and delivers within the time window.'], ['⭐', 'Notify & rate', 'The customer tracks live and rates; ratings reach the restaurant and admin.']]),
        foot: 'Delyvo · interactive prototype. All data is demo data stored only in your browser.', confirm: 'Reset all demo data to its original state?', title: 'Delyvo · Demo platform'
      }
    };
    let lang = localStorage.getItem('delyvo.hub.lang') || 'ar';
    function applyLang() {
      const t = TX[lang];
      document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.body.classList.toggle('lat', lang !== 'ar');
      document.title = t.title;
      document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = t[el.dataset.t]; });
      document.querySelectorAll('[data-lang]').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
    }
    document.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => {
      lang = b.dataset.lang; localStorage.setItem('delyvo.hub.lang', lang);
      // carry the choice into every app (each app keeps its own key)
      ['customer', 'driver', 'restaurant', 'admin'].forEach((k) => localStorage.setItem('delyvo.' + k + '.lang', lang));
      applyLang();
    });
    applyLang();
    document.getElementById('reset').onclick = () => { if (confirm(TX[lang].confirm)) { DV.reset(); ['customer','driver','restaurant','admin'].forEach(a => DV.session(a, null)); location.reload(); } };
    const live = document.getElementById('live');
    document.getElementById('liveBtn').onclick = () => { live.classList.toggle('on'); if (live.classList.contains('on')) live.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    document.getElementById('panelSel').onchange = (e) => { document.getElementById('panel').src = e.target.value; };
    try { const q = qrcode(0, 'M'); q.addData(new URL('customer/', location.href).href); q.make(); document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 0 }); } catch (e) {}
  </script>
</body>
</html>
