    window.DRIVER_INFO = {

      <img src="../assets/img/logo.png" alt="Delyvo" style="height:40px;width:auto">

      <div class="tips">
        <b>جرّب هكذا:</b>
        <ul>
          <li>ادخل كسائق — الرموز التجريبية: <b class="num">1111</b> خالد (روتردام)، <b class="num">2222</b> توم (دن هاخ)، <b class="num">3333</b> بلال (دلفت).</li>
          <li>من لوحة المطعم اجعل طلباً «جاهز» — يصلك تنبيه فوري هنا.</li>
          <li>استلم من المطعم ← ابدأ التوصيل ← تم التسليم مع صورة إثبات، وشاهد الحالة تتغيّر عند العميل.</li>

        </ul>

      <div class="links">
        <a href="../customer/">📱 تطبيق العميل</a>

        <a href="../">🏠 الصفحة الرئيسية للعرض</a>
      </div>`,
      nl: `
      <img src="../assets/img/logo.png" alt="Delyvo" style="height:40px;width:auto">
      <h1>Bezorgers-app</h1>
      <p>Een simpele, lichte app voor Delyvo-bezorgers: haal maaltijden op bij meerdere partnerrestaurants en bezorg ze per tijdvak bij abonnees. Alles synchroniseert live met de klant-app, het restaurantpaneel en het beheerpaneel.</p>

          <li>Ophalen bij het restaurant → start bezorging → bezorgd met fotobewijs, en zie de status bij de klant veranderen.</li>

        <a href="../restaurant/">👨‍🍳 Restaurantpaneel <span class="muted small num">(PIN 1234)</span></a>

      <img src="../assets/img/logo.png" alt="Delyvo" style="height:40px;width:auto">
