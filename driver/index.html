<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1FA06B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Delyvo Driver">
  <meta name="format-detection" content="telephone=no">
  <title>Delyvo Driver</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="apple-touch-icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/phone.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <script src="../shared/data.js"></script>
  <script src="../shared/store.js"></script>
  <script src="../shared/ui.js"></script>
  <script>
    DVUI.mountPhone(`
      <img src="../assets/img/logo.png" alt="Delyvo" style="height:40px;width:auto">
      <h1>تطبيق السائق</h1>
      <p>تطبيق بسيط وخفيف لسائقي Delyvo: يستلم الوجبات من عدّة مطاعم شريكة ثم يوصلها للمشتركين حسب فترة التوصيل. كل شيء متزامن لحظياً مع تطبيق العميل ولوحة المطعم ولوحة الإدارة.</p>
      <div class="tips">
        <b>جرّب هكذا:</b>
        <ul>
          <li>ادخل كسائق — الرموز التجريبية: <b class="num">1111</b> خالد (روتردام)، <b class="num">2222</b> توم (دن هاخ)، <b class="num">3333</b> بلال (دلفت).</li>
          <li>من لوحة المطعم اجعل طلباً «جاهز» — يصلك تنبيه فوري هنا.</li>
          <li>استلم من المطعم ← ابدأ التوصيل ← تم التسليم مع صورة إثبات، وشاهد الحالة تتغيّر عند العميل.</li>
          <li>افتح تبويبين جنباً إلى جنب لترى التزامن الحي.</li>
        </ul>
      </div>
      <div class="links">
        <a href="../customer/">📱 تطبيق العميل</a>
        <a href="../restaurant/">👨‍🍳 لوحة المطعم <span class="muted small num">(PIN 1234)</span></a>
        <a href="../admin/">📊 لوحة الإدارة</a>
        <a href="../">🏠 الصفحة الرئيسية للعرض</a>
      </div>
    `, { manifest: 'manifest.webmanifest' });
  </script>
  <script src="app.js"></script>
</body>
</html>
