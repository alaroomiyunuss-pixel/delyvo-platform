<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <title>Delyvo — لوحة الأدمن</title>
  <script src="i18n.js"></script>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="adm">

  <!-- App shell -->
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <img src="../assets/img/logo.png" alt="">
        <div><b class="logo-word">Delyvo</b><small data-i18n="app.panel">لوحة الأدمن</small></div>
      </div>
      <nav class="sb-nav" id="sb-nav"></nav>
      <div class="sb-foot">
        <div class="sb-foot-t tiny" data-i18n="sb.otherApps">التطبيقات الأخرى</div>
        <a href="../customer/" target="_blank" rel="noopener" class="sb-app" data-i18n="sb.customerApp">📱 تطبيق العميل</a>
        <a href="../driver/" target="_blank" rel="noopener" class="sb-app" data-i18n="sb.driverApp">🛵 تطبيق السائق</a>
        <a href="../restaurant/" target="_blank" rel="noopener" class="sb-app" data-i18n="sb.restApp">🍳 لوحة المطعم</a>
        <a href="../" target="_blank" rel="noopener" class="sb-app" data-i18n="sb.home">🏠 الصفحة الرئيسية</a>
      </div>
    </aside>
    <div class="sb-scrim" data-action="nav-close"></div>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn tb-menu" data-action="nav-open" aria-label="القائمة" data-i18n-aria="tb.menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="gsearch" id="gsearch">
          <svg class="gs-ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="gs-input" type="search" placeholder="ابحث عن عميل، طلب (DV…)، اشتراك (SUB-…)" data-i18n-ph="tb.searchPh" autocomplete="off">
          <kbd class="num">/</kbd>
          <div class="gs-results" id="gs-results" hidden></div>
        </div>
        <div class="grow"></div>
        <div class="tb-apps">
          <a class="btn btn-ghost btn-xs" href="../customer/" target="_blank" rel="noopener" data-i18n="tb.customer">العميل ↗</a>
          <a class="btn btn-ghost btn-xs" href="../driver/" target="_blank" rel="noopener" data-i18n="tb.driver">السائق ↗</a>
          <a class="btn btn-ghost btn-xs" href="../restaurant/" target="_blank" rel="noopener" data-i18n="tb.restaurant">المطعم ↗</a>
        </div>
        <div class="seg lang-sw" role="group" aria-label="اللغة" data-i18n-aria="tb.lang"><button type="button" data-action="set-lang" data-lang="ar" data-lang-btn lang="ar">AR</button><button type="button" data-action="set-lang" data-lang="en" data-lang-btn lang="en">EN</button></div>
        <button class="btn btn-outline btn-xs tb-reset" data-action="reset-demo" title="إعادة ضبط البيانات التجريبية" data-i18n-title="app.reset">↺ <span data-i18n="app.reset">إعادة ضبط البيانات التجريبية</span></button>
        <div class="bell-wrap">
          <button class="icon-btn" data-action="bell" aria-label="الإشعارات" data-i18n-aria="bell.title" id="bell-btn">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="badge-dot num" id="bell-count" hidden>0</span>
          </button>
          <div class="bell-pop card" id="bell-pop" hidden></div>
        </div>
      </header>
      <main id="main" class="main"></main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>

  <script src="../shared/data.js"></script>
  <script src="../shared/store.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="core.js"></script>
  <script src="sec-overview.js"></script>
  <script src="sec-people.js"></script>
  <script src="sec-catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
